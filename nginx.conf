server
{
    listen 14355;
    server_name stronagov.vexer.site;
    index index.html index.htm;
    root /www/wwwroot/stronagov.vexer.site;

    #SSL-START SSL related configuration
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    # API proxy to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Panel page
    location = /panel {
        try_files /panel.html =404;
    }

    # Static files
    location /static/ {
        alias /www/wwwroot/stronagov.vexer.site/static/;
        expires 30d;
    }

    # CSS and JS files
    location ~* \.(css|js)$ {
        expires 12h;
        access_log off;
    }

    # Images
    location ~* \.(gif|jpg|jpeg|png|bmp|swf|ico|svg)$ {
        expires 30d;
        access_log off;
    }

    # Forbidden files
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md|server\.js|package\.json)
    {
        return 404;
    }

    # SSL certificate verification
    location ~ \.well-known {
        allow all;
    }

    # Block sensitive files in well-known
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # Main fallback - serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log  /www/wwwlogs/stronagov.vexer.site.log;
    error_log  /www/wwwlogs/stronagov.vexer.site.error.log;
}
